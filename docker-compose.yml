services:
  resume-builder:
    build: .
    container_name: resume-builder
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-5500}
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
    ports:
      - "${HOST_PORT:-5500}:${PORT:-5500}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '5500') + '/healthz').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
